# The inputs files are relative to the root of the deepdrivewe repository.

output_dir: runs/ntl9-v1

basis_states:
  basis_state_dir: examples/amber_ntl9_hk/inputs
  basis_state_ext: .rst7
  initial_ensemble_members: 4

basis_state_initializer:
  top_file: examples/amber_ntl9_hk/common_files/ntl9.prmtop
  reference_file: examples/amber_ntl9_hk/common_files/reference.pdb

num_iterations: 106

simulation_config:
  amber_config:
    amber_exe: sander
    input_file: examples/amber_ntl9_hk/common_files/md.in
    top_file: examples/amber_ntl9_hk/common_files/ntl9.prmtop
  reference_file: examples/amber_ntl9_hk/common_files/reference.pdb

inference_config:
  # The number of simulations to maintain per bin
  sims_per_bin: 4

# The target threshold for the progress coordinate
# to be considered in the target state.
target_states:
    - label: folded
      pcoord: [1.0]

compute_config:
  name: local
  max_workers_per_node: 53
